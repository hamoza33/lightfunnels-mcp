# Fly.io app config for lightfunnels-mcp HTTP server.
# Deploy with: `flyctl launch --no-deploy` (first time, to claim the app name)
# then: `flyctl secrets set LIGHTFUNNELS_ACCESS_TOKEN=your-token MCP_AUTH_TOKEN=$(openssl rand -base64 32)`
# then: `flyctl deploy`.

app = "lightfunnels-mcp"
primary_region = "cdg"   # Paris — closest to most Lightfunnels sellers; change if needed

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 50

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
